name: Validate and publish Wombatcraft
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wombatcraft-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WOMBATCRAFT_SKIP_TESTS: ${{ contains(github.event.head_commit.message, '[release-no-tests]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python tools/validate.py
        if: env.WOMBATCRAFT_SKIP_TESTS != '1'
      - run: python -m pip install nbtlib==2.0.4 tomlkit==0.15.2
      - run: python -m unittest discover -s tests -v
        if: env.WOMBATCRAFT_SKIP_TESTS != '1'
      - run: python tools/build_release.py
      - name: Record release status
        run: python -c "import json,os,pathlib; pathlib.Path('dist/release-status.json').write_text(json.dumps(dict(commit=os.environ['GITHUB_SHA'],build_completed=True,tests_skipped=os.environ['WOMBATCRAFT_SKIP_TESTS']=='1',reason='Owner requested no testing' if os.environ['WOMBATCRAFT_SKIP_TESTS']=='1' else 'Normal validation workflow'),indent=2))"
      - uses: actions/cache@v4
        if: env.WOMBATCRAFT_SKIP_TESTS != '1'
        with:
          path: dist/server-smoke/mods
          key: server-mods-${{ runner.os }}-${{ hashFiles('mod-lock.json', 'tools/portal_patch.py') }}
          restore-keys: server-mods-${{ runner.os }}-
      - run: python -u tools/smoke_server.py
        if: env.WOMBATCRAFT_SKIP_TESTS != '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-validation
          path: |
            dist/server-validation.json
            dist/dimension-generation.json
            dist/release-status.json
            dist/server-smoke/console.log
            dist/server-smoke/install.log
            dist/server-smoke/*-registry.txt
            dist/server-smoke/quest-runtime-audit.tsv
            dist/server-smoke/shutdown-threads.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pack-release
          path: |
            dist/manifest.json
            dist/overrides.zip
            dist/Wombatcraft.mrpack
            dist/release-status.json
            dist/server-validation.json
            dist/dimension-generation.json
  launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WOMBATCRAFT_SKIP_TESTS: ${{ contains(github.event.head_commit.message, '[release-no-tests]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r launcher/requirements.txt PyInstaller==6.22.3
      - run: python tools/build_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          path: |
            dist/Wombatcraft-Launcher-Windows.zip
            dist/launcher-build.json
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [validate, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pack-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: launcher-release
          path: release
      - name: Publish release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${GITHUB_SHA}" release/* --target "${GITHUB_SHA}" --title "Wombatcraft ${GITHUB_SHA:0:8}" --notes "Client/server pack update. See release-status.json for build and test status; server-validation.json is included only when server tests ran." --latest
