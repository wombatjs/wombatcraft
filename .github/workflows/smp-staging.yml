name: Verify SMP staging module
on:
  push:
    branches: [smp-factions-staging]
    paths: ['mods/wombatcraft-smp/**', '.github/workflows/smp-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify rule invariants
        working-directory: mods/wombatcraft-smp
        run: bash gradlew --no-daemon test build
      - uses: actions/upload-artifact@v4
        with:
          name: smp-staging-only
          path: |
            mods/wombatcraft-smp/build/libs/*.jar
            mods/wombatcraft-smp/build/reports/tests/
            mods/wombatcraft-smp/build/test-results/
