# TCP mode disables Nagle on both client and upstream connections.
# No PROXY header: the Forge server expects the native Minecraft handshake.
global
    log stdout format raw local0
    maxconn 256
    nbthread 1

defaults
    mode tcp
    log global
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 10s
    timeout client 10m
    timeout server 10m

listen minecraft
    bind 74.208.117.88:25565
    server homeserver 10.77.5.2:25565
